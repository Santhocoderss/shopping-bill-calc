name: DevOps Pipeline

on:
  push:
    branches: [ main ]

jobs:
  devops-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Source Code - Checkout
      uses: actions/checkout@v4

    - name: 2. Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 3. Continuous Integration - Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 3. Continuous Integration - Run Tests
      run: |
        pytest

    - name: 4. Build - Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 4. Build - Build and Push Docker Image
      run: |
        IMAGE_TAG=${{ github.sha }}
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/shopping-bill:$IMAGE_TAG .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/shopping-bill:$IMAGE_TAG

    - name: 5. Deployment - Dynamic K8s Spec Check
      run: |
        IMAGE_TAG=${{ github.sha }}
        sed -i "s/DOCKERHUB_USERNAME/${{ secrets.DOCKERHUB_USERNAME }}/g" k8s/deployment.yaml
        sed -i "s/IMAGE_TAG/$IMAGE_TAG/g" k8s/deployment.yaml
        echo "=== Prepared Deployment Manifest for Push 1 ==="
        cat k8s/deployment.yaml
