apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-bill-deployment
  labels:
    app: shopping-bill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-bill
  template:
    metadata:
      labels:
        app: shopping-bill
    spec:
      containers:
      - name: shopping-bill-container
        image: DOCKERHUB_USERNAME/shopping-bill:IMAGE_TAG
        ports:
        - containerPort: 5000
